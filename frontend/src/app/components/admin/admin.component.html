<div class="admin-container">
  <mat-card class="admin-card">
    <mat-card-header>
      <mat-card-title>{{ 'ADMIN_PANEL' | translate }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      @if (!adminService.isLoggedIn()) {
        <form (submit)="login()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>{{ 'PASSWORD' | translate }}</mat-label>
            <input matInput type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required [disabled]="loginLoading()">
          </mat-form-field>
          <button mat-raised-button color="primary" type="submit" [disabled]="!password() || loginLoading()">
            @if (!loginLoading()) {
              <span>{{ 'LOGIN' | translate }}</span>
            }
            @if (loginLoading()) {
              <mat-spinner diameter="20"></mat-spinner>
            }
          </button>
        </form>
      }

      @if (adminService.isLoggedIn()) {
        <ng-container>
          <p>{{ 'LOGGED_IN_AS_ADMIN' | translate }}</p>
          <div class="actions">
            <button mat-raised-button color="primary" (click)="refreshData()" [disabled]="loading()">
              <mat-icon>sync</mat-icon>
              {{ loading() ? ('REFRESHING_TOURNAMENTS' | translate) : ('REFRESH_TOURNAMENTS_RATINGS' | translate) }}
              @if (loading()) {
                <mat-spinner diameter="20" class="spinner-inline"></mat-spinner>
              }
            </button>
            <button mat-raised-button color="accent" (click)="refreshAvatars()" [disabled]="refreshingAvatars()">
              <mat-icon>face</mat-icon>
              {{ refreshingAvatars() ? ('REFRESHING_AVATARS' | translate) : ('REFRESH_AVATARS' | translate) }}
              @if (refreshingAvatars()) {
                <mat-spinner diameter="20" class="spinner-inline"></mat-spinner>
              }
            </button>
            <button mat-stroked-button color="warn" (click)="logout()">{{ 'LOGOUT' | translate }}</button>
          </div>
        </ng-container>
      }
    </mat-card-content>
  </mat-card>
</div>
