<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Defs for gradients -->
  <defs>
    <linearGradient id="cueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a373;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5e3c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Warsaw Shield Shape -->
  <path d="M10,20 Q10,10 20,10 L80,10 Q90,10 90,20 V40 Q90,75 50,95 Q10,75 10,40 Z" 
        fill="#b91d47" stroke="#ffeb3b" stroke-width="3" filter="url(#shadow)"/>

  <!-- Crossed Cues -->
  <!-- Cue 1 -->
  <g transform="translate(50, 50) rotate(45)">
    <rect x="-2" y="-35" width="4" height="70" fill="url(#cueGradient)" rx="1" />
    <!-- Cue Tip -->
    <rect x="-2" y="-35" width="4" height="5" fill="#f0f0f0" />
    <rect x="-2" y="-35" width="4" height="2" fill="#3b82f6" /> <!-- Blue chalk -->
  </g>
  
  <!-- Cue 2 -->
  <g transform="translate(50, 50) rotate(-45)">
    <rect x="-2" y="-35" width="4" height="70" fill="url(#cueGradient)" rx="1" />
    <!-- Cue Tip -->
    <rect x="-2" y="-35" width="4" height="5" fill="#f0f0f0" />
    <rect x="-2" y="-35" width="4" height="2" fill="#3b82f6" /> <!-- Blue chalk -->
  </g>

  <!-- 8-Ball -->
  <circle cx="50" cy="35" r="12" fill="#111" stroke="#222" stroke-width="1"/>
  <circle cx="50" cy="35" r="5" fill="#fff"/>
  <text x="50" y="38" font-family="Arial, sans-serif" font-weight="bold" font-size="8" text-anchor="middle" fill="#000">8</text>

  <!-- "W" for Warsaw (Optional, subtle, formed by cues? No, shield is enough context) -->
</svg>
